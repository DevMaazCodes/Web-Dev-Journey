<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Basic</title>
    <meta name="description" content="In this page we will learn basics of css">
    <!--We will use the style tag to represent CSS inside HTML, the div below is called selector while the color setting is the declaration, color is the property of div and value is that rgb. We can have multiple selectors seperated by a comma as below-->
    <style>
        div, span{
            color: rgb(100, 100, 145); 
            background-color:yellow;
        }
    </style>
</head>
<body>
    <div>
        This is a sample text, dont want to use lorem
    </div>
    <span>
        Lorem ipsum, dolor sit amet consectetur adipisicing.
    </span>
</body>
</html>
