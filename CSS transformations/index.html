<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS transform property</title>
    <style>
        .box{
            border:2px solid black;
            height: 59px;
            width: 59px;
            background-color: bisque;
            display: flex;
            justify-content: center;
            align-items: center;
            transform:rotate(0.5turn); /*rotate value is used to rotate the item by a certain degree or another unit we have is turn, the values of turn are relative to one turn that is 360deg*/
            transform: rotateX(94deg);/*We can also rotate to a particular axis like here i am rotating relative to x axis i can do for y and z too, x is the base y is perpendicular and z is into the screen*/
            transform: scale(1.5);/*I can use the scale() value and write a factor in it and it will enlarge/contract upon the factor, we can also do it for particular axis like only scale x/y/z*/
            transform: skew(20deg); /*We use skew function to strecth the corners of the item, we can skew in x axis or y axis or both but not in z axis */
            transform: translate(100%,100%); /*We can use translate fucntion to move the item in y x or z direction, other than px unit we have a % unit which is relative to the dimensions of the item*/
            /*To use multiple transform functions at one item we can simply seperate them with a space and it would be used, also the angles/values in the functions can be negative too*/
        }
        .container{
            border: 2px solid brown;
            height: 80vh;
            width: 80vW;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            Box
        </div>
    </div>
</body>
</html>
