<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handling media</title>
    <meta name="description" content="In this page we will be learning about how to handle media i.e video and audio">
</head>

<body>
    <!--Like the img tag we can use video tag to display video, also we can set various attributes of a video as done below, i removed the autoplay attribute as it was pretty annoying-->
    <video controls muted aloop width="699" height="800" poster="reem.png"
        src="https://www.papytane.com/mp4/accrobra.mp4"></video>
    <!--We also have an audio tag which have similar attributes to video tag but there's an extra attribute known as preload having values none metadata and auto. If set to none the browser will not preload any data leading to slower loading time, metadata means it will preload basic info, in auto it preloads the entire audio-->
    <audio src="Hum Pyaar Karne Wale - NaaSongsHD.mp3" controls loop preload="metadata" muted></audio>
    <!--For images we also use a svg (Scalable vector graphics) tag where we can customise our images, also we can create high definintion vector images using svg-->
    <!--This is inline svg-->
    <svg height="30" width="30">
        <rect width="30" height="30" style="fill:rgb(0,0,255);stroke-width:1;stroke:rgb(0,0,0)" />
    </svg>
    <!--This is displaying external svg using img tag for this in our svg file we need to use namespace declaration-->
    <img src="img.svg" alt="img">
    <!--We will use iframe to embed another website in our website, yt has its own embedding feature-->
    <!--<iframe width="89999999" height="9999999999999999" src="https://www.codewithharry.com/tutorial/working-with-svg" frameborder="0"></iframe>-->
    <!--YT iframe below-->
    <iframe width="560" height="315" src="https://www.youtube.com/embed/5Rs8Z8sco3E?si=MS1FKAz7DNmu65i_" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>

</html>
