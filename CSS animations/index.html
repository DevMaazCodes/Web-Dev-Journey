<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS animations</title>
    <style>
        .box{
            height: 120px;
            width: 120px;

            animation-name:name;/*We use animation name to set what to do with the item/selector*/
            animation-duration: 2s; /*Duration means hwo long will be 1 iteration of the animation*/
            animation-timing-function: ease-in-out; /*Same as transition, to control how the item moves along during the animation*/
            animation-iteration-count: 3; /*To set how many times the animation will repeat without relaoding*/
            animation-delay:0ms; /*We use this to set after how long since loading the page the animation will start*/
            animation-direction: alternate-reverse; /*We can set different different ways to play the animation like reverse makes it from to till from unlike the usual from to.*/
            animation-play-state: running; /*We can use animation play-state to set the status of our animation when paused the animation would stop at the same point where it was and by unpausing it doesn't restart rather literally gets unpaused and run from the same point where it was*/
            /* animation: name duration timing-function delay iteration-count direction fill-mode; This is the short hand of animation like we had for transition, if multiple animations needed we can just use comma to seperate them*/
            animation: name 1s ease 1s 2 alternate-reverse ;
            animation-fill-mode: backwards; /*We can use animation fill mode if we want our item to retain properties and position of to/from, if we use forwards it retains the position and property at the to part of the animations if backwards retains nothing form animation styling*/
            
        }
        .container{
            height: 500px;
            width: 500px;
            background-color: green;
        }
        @keyframes name{ 
            /*We create animations using @keyframes in plcae of name i can use anything as the identifier of my animations, we use the from and to set how to proceed with the animations*/
            from{
background-color: blue;
            }
            to{
                transform:translateX(150px) translateY(150px);
                background-color: red;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">BIG BOX</div>
    </div>
</body>
</html>
