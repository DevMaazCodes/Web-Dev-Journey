<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box and text shadows and outline</title>
    <style>
        div{
            margin: 90px;
            box-shadow: 7px 7px 3px 3px grey inset; /*This is the box shadow property which adds shadow to my element, the values are h-off v-off blur spread color inset. Inset makes the shadows inside element and by default its outside*/
            text-shadow:8px 3px 3px yellow; /*This is the text shadow property which adds shadow to my text, the values are h-off v-off blur color*/
            outline: 3px solid red;/* An outline is a line that is drawn around elements and takes space inside layout unlike border which takes up space in box model. It's commonly used for accessibility purposes, like highlighting focused elements. The values are like border, width style color*/
            outline-offset: 80px; 
            /* we can move the outline more outside by using outline offset unlike borders which are fixed, the drawback of using outline is no rounded edges as it doesn't have border radius like border */
        }
    </style>
</head>
<body>
    <div>
        Lorem ipsum dolor sit, amet consectetur adipisicing elit. Ut reiciendis porro molestias perferendis exercitationem perspiciatis delectus, est libero repellendus sapiente quo sunt commodi.
    </div>
</body>
</html>
