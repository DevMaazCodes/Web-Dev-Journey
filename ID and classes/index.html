<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID and Classes- HTML</title>
    <meta name="description" content="This page is about id and classes in HTML">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--An id is a unique identification of an element, each element must have a unique id if an id is given while class attribute are the qualities/classification of an element, these are very useful for styling in css.Each class under the class attribute is seperated by a space-->
    <div id="firstdiv" class="red-text yellow-bg">
        Hi, everyone this is the first div.
    </div>
    <span id="firstspan" class="blue-text white-bg">
        This is the first spam
    </span>
    
</body>
</html>
