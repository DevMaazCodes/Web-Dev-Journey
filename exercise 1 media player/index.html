<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Player</title>
    <meta name="description" content="This page showcase a media player built to showcase ">
</head>

<body>
    <header>
        <h1>
            This is a sample media player made using HTML
        </h1>
    </header>
    <main>
        <section>
            <h2>
                Video
            </h2>
            <div>
                <video controls src="https://www.papytane.com/mp4/accrobra.mp4"></video>
            </div>
            <!--We can make many divs for multiple videos-->

        </section>
        <section>
            <h2>
                Audio
            </h2>
           <div><audio controls src="Hum Pyaar Karne Wale - NaaSongsHD.mp3"></audio></div> 
           <!--Can make many divs for multiple audios-->
        </section>
    </main>
    <footer>
        This is the end of this
    </footer>
</body>

</html>
