<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .ball {
            height: 121px;
            width: 121px;
            background-color: red;
            border-radius: 70px;
            position: absolute;
            bottom: 0;
            left: 0;
            animation: vertical 2s cubic-bezier(0.21, 0.97, 0.59, 0.95) 2s alternate infinite, horizontal 10s linear 2s infinite;
        }

        .container {
            position: relative;
            height: 80vh;
            width: 80vw;
            background-color: blue;
        }

        @keyframes vertical {
            from {
                bottom: 0;
            }

            to {
                bottom: 100%;
            }
        }

        @keyframes horizontal {
            from {
                left: 0;
            }

            to {
                left: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="ball">
        </div>
    </div>

</body>

</html>
