<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookmark Manager- Maaz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>My Bookmark Manager- Maaz</h1>
    <h2>Primary Bookmark (for personal use only)</h2>
    <!--Using the 'a 'tag for links, the target attribute with _blank value is used for redirecting link to a new tab, the href is the usual attribute for 'a' tag where we need to give the reference link-->
    <p> 
        <a target="_blank" href="https://github.com/DevMaazCodes">My GitHub</a>
    </p>
    <p>
        <a target="_blank" href="https://www.codewithharry.com/tutorial/html-tags">Code with Harry</a>
    </p>
    <p>
        <a target="_blank" href="https://www.youtube.com/watch?v=tVzUXW6siu0&list=PLu0W_9lII9agq5TrH9XLIKQvv0iaF2X3w">YT playlist of Sigma Web Dev</a>
    </p>
    <h2>Secondary Bookmark (for personal use only)</h2>
    <p>
        <a target="_blank" href="https://x.com/home">My twitter/X account</a>
    </p>
    <p>
        <a target="_blank" href="https://gmail.com">My G-Mail</a>
    </p>
    <script src="script.js"></script>
</body>
</html>
