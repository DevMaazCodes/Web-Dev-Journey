<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript DOM</title>
</head>
<body>
    <div class="DOM">
        Basically, the DOM translates the raw HTML document into a live hierarchial tree of objects which js can can access to modify and style web content without a page reload
    </div>
    <script>
        document.title="Javascript document object model" //to target the title of the html
        console.log(document.title) //shows the title in console
        console.log(document.body) //shows the body in console
    </script>
</body>
</html>
