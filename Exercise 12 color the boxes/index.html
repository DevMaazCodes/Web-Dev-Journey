<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fill the boxes</title>
    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 23px;
        }

        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 45px;
            height: 45px;
            border: 2px solid black;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="box-1" class="box">box</div>
        <div id="box-2" class="box">box</div>
        <div id="box-3" class="box">box</div>
        <div id="box-4" class="box">box</div>
        <div id="box-5" class="box">box</div>
    </div>
    <script src="script.js"></script>
</body>

</html>
