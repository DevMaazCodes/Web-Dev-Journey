<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>
    <meta name="description" content="We will be learning about CSS box model which includes margin padding and border">
    <style>
        * {
            /*Using universal selector to reset browser's default padding, margin and border*/
            margin: 0;
            padding: 0;
            border: 0;
        }

        .box {
            color:yellow;
            background-color: red;
        }
    </style>
</head>

<body>
    <div class="box">
        This is a box model, which consists if three things. The padding,border and margin. The margin is the outermost layer under which there is a border and the innermost is padding
    </div>
</body>

</html>
