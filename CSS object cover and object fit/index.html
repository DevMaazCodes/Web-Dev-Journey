<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS object fit and position</title>
    <style>
        .container {
            height: 400px;
            width: 500px;
            padding: 10px;
            background-image: url("https://cdnb.artstation.com/p/marketplace/presentation_assets/003/430/265/large/file.jpg?1706950304"); /*Using this we can set an image to the background instead of our default color property*/
            background-position: center center; /*We can use the background position property like the image-position to set what part of our image we want to see in background*/
            border: 10px solid black;
            background-repeat:no-repeat; /*When we have a small image i.e an image whose dimensions are smaller than the container for background, by default it repeats itself to fill the remaining space by using background-repeat property we can control how it repeats, either in X or Y or no-repeat, by default img repeats in both axis*/
            background-clip: content-box; /*The background-clip property decides how far the background image goes the default is the border box, but we can have different box models too*/

        }
        img{
            width: 500px;
            height: 400px;
            object-fit: contain /*cover*/; /*Using the object-fit property with value cover will cut the image and make it fit for the height and width we gave to our image, it has no relation with our container, we can use the contain value if we dont want the image to be cut/cropped but in that case to maintain the aspect ratio the image wont fit the height, by default the object-fit is set to fill which distorts the img*/
            object-fit: cover;
            object-position: top right; /*When we use object-fit cover the image is cropped, we can choose which section to crop using the object-position property, like here the top right part is being shown and other is cropped to maintain aspect ratio*/
            object-position: 50% 50%x; /*We can also set the position in units like % or px and move our image*/
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- <img src="https://cdnb.artstation.com/p/marketplace/presentation_assets/003/430/265/large/file.jpg?1706950304"
            alt="image"> -->
    </div>
</body>

</html>
