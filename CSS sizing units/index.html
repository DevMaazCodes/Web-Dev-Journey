<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Different units for sizing in CSS</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .test{
            background-color:aqua;  
            /*There are multiple units sizing in CSS, the most common is pixels(px),then there is viewport height and width which is responsive thus depends on device/viewport*/
            /*width: 110px;
            height: 90px;*/
            width: 100vw;
            height:100vh;
            border:3px solid red;
            
            
            
        }
    </style>
</head>
<body>
    <div class="test">
        Lorem ipsum dolor sit amet, consectetur adipisicing elit. Ipsum iure excepturi perspiciatis dolor alias quasi! Quae quidem, rerum veritatis facilis incidunt ex nulla!
    </div>
    
</body>
</html>
