<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Different units for sizing in CSS</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .test{
            background-color:aqua;  
            /*There are multiple units sizing in CSS, the most common is pixels(px),then there is viewport height and width which is responsive thus depends on device/viewport*/
            /*width: 110px;
            height: 90px;*/
            color: blueviolet;
            width: 100vw;
            height:100vh;
            border:3px solid red;
            font-size: 18px;
        }
        .test p{
            /*.test p inherits the properties of .test we gave above (it's direct parent), em means the multiple of the quantity above like font size is 18 above, so 1.5em here means 1.5*18 i.e 27*/
            font-size:1.5em;
            /*If we want .test to not inherit its parent property but we want it to be a multiple of the root element such as html we will use rem, html base font size is 16px so we can 1.5rem font size to make it 1.5*16 i.e 24*/
            font-size:1.5rem;

        }
    </style>
</head>
<body>
    <div class="test">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Odio maiores dignissimos, animi corporis, itaque earum placeat vitae maxime dicta atque quos voluptates nesciunt!
        </p>
        
    </div>
    
</body>
</html>
