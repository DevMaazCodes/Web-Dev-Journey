<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .big{
            font-size: 40px;
        }
    </style>
</head>

<body>
    <div class="container big small hi bye" style="display: flex; background-image:none;">
        <div class="box">This is a box</div>
        <div class="box">This is a box</div>
        <div class="hidden" hidden>This text is hidden</div> 
        <!-- the hidden attribute in div makes it hidden though it can be manipulated through js -->
         <div class="data" data-date="17/10/26" data-day="saturday" data-game="valorant"></div>
         <!-- we can create custom attributes that belong to dataset using data-"custom-name" -->
    </div>
    <script src="script.js"></script>
</body>

</html>
