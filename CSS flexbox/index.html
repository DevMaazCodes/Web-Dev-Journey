<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css flexbox</title>
    <meta name="description" content="In this webpage i will be learning CSS flexbox">
    <style>
        .container{
            display:flex; /*Using flex display to use flexbox  properties and we use it on the parent container where items are located*/
            height: 80vh;
            border: 2px solid black;
            justify-content: center; /*Using justify content to align items horizontally*/
            /*align-items:center; /*Using align-items to align items vertically when we have only only one line, for multiple lines we use alignn content*/
            flex-direction: row; /*We can use flex direction to set in which direction items will start from row is by default i.e left to right, we also have coloumn and reverses of row and coloumn*/
            flex-wrap:wrap; /*This makes the overflow content to fall in the next line*/
            align-items:center; /*Centering for multiple lines*/
            gap:20px 10px; /*The gap property gives gap between items in the container, first value is row-gap aka vertical gap and second is coloumn-gap aka horizontal gap*/
        } 
        .item{
            background-color: rgb(114, 168, 168);
            border:2px solid black;
            /* margin: 12px 10px; */
            height: 15px;
            width: 15px;
        }
        .item1{
            order: 2; /*Order is an element property when container has display flex, by default the order of an item is 0, the higher the order the later it will come*/
            flex-grow: 1; /*The more the flex grow value the more it will grow, the flex-grow property causes the item to take more space i.e grow when there's space leftover, the value is useful when it's sibling items also grow, the higher the value the more space it will take compared to sibling. By default the value is 0 which means te item wont grow*/
            align-self: flex-end; /*self align is used to align a single element/item in a flex box so it is an item property while align items/content are container properties and we cant use align content if we want to use align self as the align content overwrites the cross axis alignment of align self*/
        }
        .item3{
            order:-1; /*Item 3 will come at first as rest has order 0*/
            flex-shrink: 0; /*Flex shrink makes the item shrink when space is constricted by default all items shrink proportionally as all have value 1, value 0 makes it rigid and it doesnt shrink, the higher the value the more it will shrink relative to its siblings*/

        }
    </style>
</head>
<body>
