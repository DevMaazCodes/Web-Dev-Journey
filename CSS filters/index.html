<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS filters</title>
    <style>
        img{
            filter: blur(10px); /*The syntax of filter is like this there are many different functions in filter*/
            filter: blur(4px); /*The blur function makes the picture/img blur*/
            width: 300px;
            object-fit: cover;
            filter: brightness(100%); /*We can use the brightness function to control brightness usually in percentage*/
            filter: contrast(300%); /*We can use the contrast function to control contrast usually in percentage or decimal*/
            filter: brightness(100%) contrast(50%); /*To use multiple filter functions we can simply seperate them using space*/
            filter: grayscale(100%); /*The grayscale function makes the image black and white, the percentage means how much black and white we want, at 100% image is completely black and white*/
            filter: sepia(80%); /*The sepia function makes the image like old 80's image, the percentage means how much brownish we want, at 100% image is like 80's image  */
            filter: invert(60%); /*We can use the invert function to make the properties of image inverted resulting in a negative image, the values of invert means how much inverted we want the values to be and the values are usually in percentage or decimal*/
            filter:opacity(80%); /*We can use the opacity function to control the transparency of an image, its values goes from 0 to 1, 0 meaning fully transparent so image vanishes while 1 means full opacity which means image is fully visible, it can also be represented in percentage*/
            filter: brightness(200%) opacity(40%);

        }
    </style>
</head>
<body>
    <img src="https://images.pexels.com/photos/35537/child-children-girl-happy.jpg?cs=srgb&dl=pexels-bess-hamiti-83687-35537.jpg&fm=jpg" alt="human">
</body>
</html>
