<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS grid</title>
    <meta name="description" content="In this video we will learn about CSS grid and its properties">
    <style>
        .container {
            border: 2px solid maroon;
            display: grid;
            /*We use display grid to use grid properties*/
            grid-template-columns: [first] 120px [doosra] 90px;
            /*grid-template-coloumn let us set the number and size/width of coloumns, we can also set the name as done above inside square brackets of our columns*/
            grid-template-rows: [row1] 100px [doosri-row] 100px [row-3] 100px;
            /*grid-template-row let us set the number and size/height of rows, also we can name the like i did in square brackets*/
        }

        .item {
            border: 2px solid navajowhite;
            height: 40px;
            width: 40px;
        }

        .item3 {
            grid-row: 2/3;
            grid-column: 2/3;
            /*We can use grid-row and grid-column properties lo allocate the grid space to an item, the value goes like start/end the numbers are line numbers*/
        }

        .item4 {
            grid-row: 2/3;
            grid-column: 2/3;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item item1">1</div>
        <div class="item item2">2</div>
        <div class="item item3">3</div>
        <div class="item item4">4</div>
        <div class="item item5">5</div>
    </div>
</body>

</html>
