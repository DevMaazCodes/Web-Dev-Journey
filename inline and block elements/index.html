<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block and inline elements</title>
    <meta name="description" content="This is a sample form without using br tag and using inline or block elements">
</head>

<!--BLock elements are elements that take the entire width of screen while inline elements take the space they require only. Example of block elements are div p(para) h1 h2 ... h6, example of inline are span,img,strong,a,input-->
<body>
    <form method="post">
        <div>
            <label for="name">Write your name</label>
            <input type="text" id="name" name="name" placeholder="Write your name">
        </div>
        <div>
            <label for="city">Enter your city</label>
            <input type="text" name="city" id="city" placeholder="Enter your city">
        </div>
        <div>
            <label for="pincode">Enter your pincode</label>
            <input type="text" name="pincode" id="pincode" placeholder="Enter your pincode">
        </div>

    </form>
</body>

</html>
