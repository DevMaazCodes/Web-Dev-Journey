<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entities, Code tag and more</title>
    <meta name="description" content="We will learn entities, code tag and other miscellaneous things in HTML">
</head>
<body>
    <!--For displaying code on our website we use different entities-->
    &lt;p&gt; <!--We use &lt for less than sign and gt for greater than-->
    &amp; <!--We use this to show the amp percent symbol-->
    &copy; <!--This is for copyright symbol-->
    &nbsp; <!--This ensures the line doesn't break upon adding a text like done below, normal spaces can break line and go into next this is preserved via nbsp, also we do multiple spaces using nbsp as html avoids multiple space and treat as one-->
    meeting end at 12&nbsp;&nbsp;&nbsp;pm
    <pre>
        We use pre tag to conserve formatting
        like this line break     and this space
    </pre>
</body>
</html>
