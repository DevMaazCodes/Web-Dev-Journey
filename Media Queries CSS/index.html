<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS media queries</title>
    <style>
        body{
            background-color: yellow;
        }
        .box{
            width: 233px;
            height: 233px;
            margin: 3px;
            border: 2px solid black;
        }
        @media only screen and (min-width:740px){
            .boxes{
                display:flex;
            }
        }
    </style>
</head>
<body>
    <div class="boxes">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
